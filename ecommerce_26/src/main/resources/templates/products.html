<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WAX | Premium Mobile Devices</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts: Roboto & Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #121212;
            --card-bg: #1e1e1e;
            --accent: #00bcd4; /* Cyan glowing accent */
            --text-primary: #e0e0e0;
            --text-secondary: #b0b0b0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-primary);
            font-family: 'Roboto', sans-serif;
            padding-bottom: 50px;
        }

        /* Elegant Navbar with Gradient */
        .navbar {
            background: linear-gradient(90deg, #0d47a1 0%, #00bcd4 100%);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            font-family: 'Montserrat', sans-serif;
        }

        .navbar-brand {
            font-weight: 700;
            color: white !important;
            letter-spacing: 1px;
        }

        h1.page-title {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 30px;
            margin-bottom: 40px;
            color: var(--accent);
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        /* Modern Dark Cards with Glow */
        .card {
            background-color: var(--card-bg);
            border: 1px solid #333;
            border-radius: 15px;
            transition: all 0.3s ease-in-out;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-10px);
            border-color: var(--accent);
            box-shadow: 0 10px 25px rgba(0,188,212,0.2);
        }

        .card-img-top {
            height: 220px;
            object-fit: contain;
            padding: 20px;
            background-color: #fff; /* Keeps images on white background */
            border-bottom: 1px solid #333;
        }

        .card-title {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            color: white;
        }

        .card-subtitle {
            color: var(--accent) !important;
            font-weight: 500;
        }

        .card-text {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .price-tag {
            font-size: 1.3rem;
            font-weight: 700;
            color: #4caf50; /* Green price */
        }

        .btn-buy {
            background-color: var(--accent);
            color: var(--bg-dark);
            font-weight: 600;
            border-radius: 20px;
            padding: 8px 20px;
            transition: all 0.2s;
        }

        .btn-buy:hover {
            background-color: white;
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        footer {
            border-top: 1px solid #333;
            margin-top: 50px !important;
        }
    </style>
</head>
<body>

<!-- Navigation Bar -->
<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container">
        <a class="navbar-brand" href="#">
            <span style="font-size: 1.4rem;">⬡</span> NEXUS
        </a>
        <span class="navbar-text">Authentic Devices | Fast Delivery</span>
    </div>
</nav>

<!-- Main Product Grid -->
<div class="container">
    <h1 class="page-title text-center">Latest Releases</h1>
    
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4">
        <!-- Thymeleaf Loop iterating over device list -->
        <div class="col" th:each="phone : ${phones}">
            <div class="card h-100">
                <img th:src="${phone.imageUrl}" class="card-img-top" alt="...">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title" th:text="${phone.name}">iPhone 15 Pro</h5>
                    <h6 class="card-subtitle mb-2" th:text="${phone.brand}">Apple</h6>
                    <p class="card-text flex-grow-1" th:text="${phone.specs}">Specs here</p>
                    <div class="d-flex justify-content-between align-items-center mt-auto pt-3 border-top border-secondary">
                        <span class="price-tag" th:text="'$' + ${phone.price}">$999.00</span>
                        <button class="btn btn-buy btn-sm">Add</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Footer -->
<footer class="py-4 bg-dark text-center text-secondary">
    <div class="container">
        <p class="mb-1">&copy; 2026 WAX Electronics</p>
        <small>JVM Profiling & Load Testing Target</small>
    </div>
</footer>

</body>
</html>
